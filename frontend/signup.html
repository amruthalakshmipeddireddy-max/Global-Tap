<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <title>Sign up - Global Tap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="auth-sub">Tell us a little about yourself. Your details are stored securely in Supabase.</p>

      <div class="form-error" id="signupError"></div>
      <div class="form-done" id="signupDone"></div>

      <form id="signupForm">
        <label class="field">Full name
          <input type="text" id="signupName" required autocomplete="name" placeholder="Your full name" />
        </label>
        <label class="field">Email
          <input type="email" id="signupEmail" required autocomplete="email" placeholder="you@example.com" />
        </label>
        <label class="field">Phone (optional)
          <input type="tel" id="signupPhone" autocomplete="tel" placeholder="+91 ..." />
        </label>
        <label class="field">Home country
          <select id="signupCountry">
            <option value="IN">India</option>
            <option value="US">United States</option>
            <option value="AE">United Arab Emirates</option>
            <option value="GB">United Kingdom</option>
            <option value="SG">Singapore</option>
          </select>
        </label>
        <label class="field">Password (min. 6 characters)
          <input type="password" id="signupPassword" required minlength="6" autocomplete="new-password" placeholder="Choose a password" />
        </label>
        <button class="auth-btn" type="submit">Sign up</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
      <p class="auth-note">Supabase sends the verification email and generates the verification link itself.</p>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script>
    // Already logged in? Skip straight to the app.
    if (gtToken()) {
      window.location.href = 'index.html';
    }

    document.getElementById('signupForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      try {
        var data = await gtApi('/api/auth/signup', {
          method: 'POST',
          body: {
            full_name: document.getElementById('signupName').value.trim(),
            email: document.getElementById('signupEmail').value.trim(),
            phone: document.getElementById('signupPhone').value.trim(),
            home_country: document.getElementById('signupCountry').value,
            password: document.getElementById('signupPassword').value,
          },
        });
        document.getElementById('signupForm').style.display = 'none';
        var done = document.getElementById('signupDone');
        done.textContent = data.message;
        done.style.display = 'block';
      } catch (err) {
        showFormError('signupError', err.message);
      }
    });
  </script>
</body>
</html>
